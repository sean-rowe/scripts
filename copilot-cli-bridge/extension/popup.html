<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px/1.4 system-ui, sans-serif; width: 300px; margin: 0; padding: 12px; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      label { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
      input[type="text"] { flex: 1; padding: 4px 6px; }
      .row { display: flex; justify-content: space-between; align-items: center; margin: 6px 0; }
      #status { font-size: 12px; padding: 6px 8px; border-radius: 6px; background: #f0f0f0; }
      .ok { color: #137333; } .bad { color: #c5221f; }
      button { padding: 6px 10px; cursor: pointer; }
      a { font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>Copilot CLI Bridge</h1>
    <div id="status">checking host…</div>
    <div class="row"><button id="ping">Test host</button><a href="#" id="opts">Options</a></div>
    <hr />
    <label><input type="checkbox" id="enabled" /> Enabled on this browser</label>
    <label>
      <input type="checkbox" id="allSites" />
      Run on all sites (grant access once, no per-site prompts)
    </label>
    <label>Marker <input type="text" id="marker" placeholder="#!run" /></label>
    <label><input type="checkbox" id="autoType" /> Type results back into chat</label>
    <label><input type="checkbox" id="autoSubmit" /> Auto-send after typing</label>
    <p style="font-size:12px;color:#666;margin:8px 0 0">
      Allowlist is set in the native host config, not here.
    </p>
    <script src="popup.js"></script>
  </body>
</html>
